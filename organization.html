<div class="page">

<main class="organization-page">

    <section class="organization-profile" id="organization-profile">
        <div class="organization-heading">
            <img id="organization-logo" src="" alt="Organization logo">
            <div>
                <h1 id="organization-name">Loading...</h1>
                <p id="organization-abbreviation"></p>
            </div>
        </div>

        <div class="organization-details">
            <h2>Organization Information</h2>

            <p><strong>Type:</strong> <span id="organization-type"></span></p>
            <p><strong>Founded:</strong> <span id="organization-founded"></span></p>
            <p><strong>Headquarters:</strong> <span id="organization-headquarters"></span></p>
            <p><strong>Leader:</strong> <span id="organization-leader"></span></p>

            <p>
                <strong>Website:</strong>
                <a id="organization-website" href="#" target="_blank">Visit website</a>
            </p>
        </div>

        <div class="organization-about">
            <h2>About</h2>
            <p id="organization-description"></p>
        </div>

    </section>


    <!-- RIGHT: ORGANIZATION NEWS -->
    <section class="organization-news-section">
        <h2>Latest News</h2>
        <p class="news-subtitle">Articles published by this organization</p>
        <p id="news-status">Loading news...</p>
        <div id="organization-news"></div>
    </section>

</main>
